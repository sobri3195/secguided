const state = { page:'home', selectedLesson:null, qOrder:[], idx:0, answers:[] };
const pages = ['home','lessons','quiz'];

function setPage(page) {
  state.page=page;
  pages.forEach(p=>document.getElementById(p).classList.toggle('hidden',p!==page));
  document.querySelectorAll('.nav .btn').forEach(b=>{
    b.classList.toggle('primary', b.dataset.page===page);
    if(b.dataset.page!==page) b.classList.remove('primary');
  });
  if(page==='home') renderHome();
  if(page==='lessons') renderLessons();
  if(page==='quiz') initQuiz();
}

document.querySelectorAll('[data-page]').forEach(btn=>btn.onclick=()=>setPage(btn.dataset.page));

function renderHome() {
  const b = curriculum.modules.filter(m=>m.level==='Beginner').length;
  const i = curriculum.modules.filter(m=>m.level==='Intermediate').length;
  home.innerHTML = `
    <h1>${curriculum.topic}</h1>
    <p class="muted">Mobile-first, offline, stateless micro-LMS for beginner to intermediate learners.</p>
    <div class="row"><span class="chip">${curriculum.modules.length} modules</span><span class="chip">${b} beginner</span><span class="chip">${i} intermediate</span><span class="chip">${questionBank.totalQuestions} MCQs</span></div>
    <div class="grid modules" style="margin-top:12px;">${curriculum.modules.map(m=>`<article class='card'><h2>${m.id} · ${m.title}</h2><p class='muted'>${m.level} · ${m.lessons.length} lessons</p></article>`).join('')}</div>
    <div style="margin-top:14px"><button class="btn primary" onclick="setPage('lessons')">Start learning</button></div>
  `;
}

function renderLessons() {
  const lessons = curriculum.modules.flatMap(m=>m.lessons.map(l=>({...l,moduleId:m.id,moduleTitle:m.title,level:m.level})));
  const detail = state.selectedLesson || lessons[0];
  state.selectedLesson = detail;
  lessonsDiv = `
    <div class="grid modules">${lessons.map(l=>`<button class='btn ${detail.id===l.id?'primary':''}' onclick='pickLesson("${l.id}")'>${l.moduleId} · ${l.title}</button>`).join('')}</div>
    <article class="card" style="margin-top:12px;">
      <h2>${detail.title}</h2>
      <p class="muted">${detail.level} · ${detail.moduleTitle} · ~${detail.durationMinutes} min</p>
      <p>${detail.content}</p>
      <h3>3 Safe Examples</h3>
      <ul>${detail.safeExamples.map(e=>`<li>${e}</li>`).join('')}</ul>
      <h3>Exercise</h3><p>${detail.exercisePrompt}</p>
    </article>
  `;
  document.getElementById('lessons').innerHTML=`<h1>Lessons</h1><p class='muted'>Choose any lesson card below.</p>${lessonsDiv}`;
}

function pickLesson(id) {
  const lessons = curriculum.modules.flatMap(m=>m.lessons.map(l=>({...l,moduleId:m.id,moduleTitle:m.title,level:m.level})));
  state.selectedLesson = lessons.find(l=>l.id===id);
  renderLessons();
}
window.pickLesson=pickLesson; window.setPage=setPage;

function shuffle(arr) { return [...arr].sort(()=>Math.random()-0.5); }
function initQuiz() {
  if(state.qOrder.length===0) {
    state.qOrder = shuffle(questionBank.questions);
    state.idx = 0;
    state.answers = new Array(state.qOrder.length).fill(null);
  }
  renderQuiz();
}

function answerCurrent(i) { state.answers[state.idx]=i; renderQuiz(); }
function nextQ() { if(state.idx<state.qOrder.length-1) state.idx++; renderQuiz(); }
function prevQ() { if(state.idx>0) state.idx--; renderQuiz(); }
function restartQuiz() { state.qOrder=[]; initQuiz(); }
window.answerCurrent=answerCurrent; window.nextQ=nextQ; window.prevQ=prevQ; window.restartQuiz=restartQuiz;

function renderQuiz() {
  const q = state.qOrder[state.idx];
  const chosen = state.answers[state.idx];
  const answered = state.answers.filter(a=>a!==null).length;
  const done = answered===state.qOrder.length;
  const score = state.answers.reduce((s,a,ix)=> s + (a===state.qOrder[ix].correctIndex?1:0), 0);

  const review = done ? `<article class='card'><h2>Final Score: ${score} / ${state.qOrder.length}</h2><p class='muted'>Review all answers with explanations below.</p>${state.qOrder.map((item,ix)=>{
    const user = state.answers[ix];
    const ok = user===item.correctIndex;
    return `<div style='padding:10px;border-top:1px solid #e5e7eb'><strong>${ix+1}. ${item.question}</strong><p>Your answer: ${user===null?'(none)':item.options[user]}</p><p>Correct: ${item.options[item.correctIndex]}</p><p style='color:${ok?'var(--ok)':'var(--bad)'}'>${ok?'Correct':'Needs review'} · ${item.explanation}</p></div>`;
  }).join('')}</article>` : '';

  quiz.innerHTML = `
    <h1>Quiz (100 MCQs)</h1>
    <p class='muted'>Questions are randomized every new attempt. Stateless mode: refresh resets progress.</p>
    <div class='row'><span class='chip'>Question ${state.idx+1} / ${state.qOrder.length}</span><span class='chip'>Answered: ${answered}</span><span class='chip'>Score so far: ${score}</span></div>
    <article class='card' style='margin-top:10px;'>
      <h2>${q.question}</h2>
      <div class='options'>${q.options.map((opt,ix)=>`<button class='${chosen===ix?'selected':''}' onclick='answerCurrent(${ix})'>${String.fromCharCode(65+ix)}. ${opt}</button>`).join('')}</div>
      <p style='margin-top:8px'><strong>Explanation:</strong> ${q.explanation}</p>
      <div class='row' style='margin-top:10px;'>
        <button class='btn' onclick='prevQ()'>Previous</button>
        <button class='btn primary' onclick='nextQ()'>Next</button>
        <button class='btn' onclick='restartQuiz()'>Restart (re-randomize)</button>
      </div>
    </article>
    ${review}
  `;
}

renderHome();
</script>
