const STORAGE_KEY='miniLMS.csf.v1';
let state={guest:false,completed:[],lastLesson:null,attempts:{}};
function load(){if(state.guest)return;const raw=localStorage.getItem(STORAGE_KEY);if(raw)state={...state,...JSON.parse(raw)};}
function save(){if(!state.guest)localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function progressPct(){const total=curriculum.modules.reduce((a,m)=>a+m.lessons.length,0);return Math.round((state.completed.length/total)*100)}
function renderHome(){const next=state.lastLesson||curriculum.modules[0].lessons[0].id;const best=Object.values(state.attempts).reduce((a,b)=>Math.max(a,b.best||0),0);home.innerHTML=`<div class='card'><h2>Continue Learning</h2><p>Progress: <span class='ok'>${progressPct()}%</span></p><p>Last opened lesson: ${next}</p><p>Best quiz score: ${best}%</p><button class='primary' onclick="openLesson('${next}')">Open last lesson</button></div><div class='grid cols-2'>${curriculum.modules.map(m=>`<article class='card'><h3>${m.id} · ${m.title}</h3><p>${m.lessons.length} lessons</p><p>${m.lessons.filter(l=>state.completed.includes(l.id)).length} completed</p></article>`).join('')}</div>`;}
function renderLessons(){lessons.innerHTML=`<div class='grid cols-2'>${curriculum.modules.map(m=>`<div class='card'><h3>${m.id} · ${m.title}</h3>${m.lessons.map(l=>`<p><button class='btn' onclick="openLesson('${l.id}')">${l.title}</button> ${state.completed.includes(l.id)?'✅':''}</p>`).join('')}</div>`).join('')}</div><div id='reader' class='card'><p>Select a lesson.</p></div>`;}
function openLesson(id){showPage('lessons');const mod=curriculum.modules.find(m=>m.lessons.some(l=>l.id===id));const l=mod.lessons.find(x=>x.id===id);state.lastLesson=id;save();const reader=document.getElementById('reader');reader.innerHTML=`<span class='pill'>${mod.id}</span><span class='pill'>${l.id}</span><h2>${l.title}</h2><h4>Learning objectives</h4><ul>${l.learningObjectives.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Explanation</h4><p>${l.explanation}</p><h4>Safe examples</h4><ul>${l.safeExamples.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Quick practice</h4><p>${l.quickPractice}</p><h4>Key takeaways</h4><ul>${l.keyTakeaways.map(x=>`<li>${x}</li>`).join('')}</ul><button class='primary' onclick="completeLesson('${id}')">Mark complete</button>`;}
function completeLesson(id){if(!state.completed.includes(id))state.completed.push(id);save();renderHome();renderLessons();openLesson(id);}
function renderQuiz(){quiz.innerHTML=`<div class='card'><h2>Quiz Mode</h2><p>Pick a module quiz (12-13 questions) or full exam (100 questions).</p>${curriculum.modules.map(m=>`<button onclick="startQuiz('${m.id}')">${m.id} Quiz</button>`).join(' ')} <button class='primary' onclick="startQuiz('ALL')">Full Exam</button></div><div id='quizArea'></div>`}
function startQuiz(moduleId){const items=moduleId==='ALL'?questionBank:questionBank.filter(q=>q.moduleId===moduleId);let i=0,score=0;const area=document.getElementById('quizArea');const draw=()=>{const q=items[i];if(!q){const pct=Math.round((score/items.length)*100);state.attempts[moduleId]={best:Math.max(pct,(state.attempts[moduleId]?.best||0)),count:(state.attempts[moduleId]?.count||0)+1};save();renderHome();area.innerHTML=`<div class='card'><h3>Done</h3><p class='ok'>Score: ${pct}%</p></div>`;return;}area.innerHTML=`<div class='card'><p>${i+1}/${items.length} · <span class='pill'>${q.difficulty}</span></p><h3>${q.question}</h3>${q.options.map((o,idx)=>`<button class='option' onclick='answer(${idx})'>${o}</button>`).join('')}<p id='exp'></p></div>`;window.answer=(idx)=>{const ok=idx===q.correctAnswerIndex;if(ok)score++;document.getElementById('exp').textContent=(ok?'Correct. ':'Not quite. ')+q.explanation;i++;setTimeout(draw,450);};};draw();}
function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));document.getElementById(name).classList.remove('hidden');}
document.querySelectorAll('nav button[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
document.getElementById('guestBtn').onclick=()=>{state.guest=!state.guest;document.getElementById('guestBtn').textContent='Guest Mode: '+(state.guest?'On':'Off');if(!state.guest)save();};
document.getElementById('resetBtn').onclick=()=>{localStorage.removeItem(STORAGE_KEY);state={guest:state.guest,completed:[],lastLesson:null,attempts:{}};renderHome();renderLessons();renderQuiz();};
load();renderHome();renderLessons();renderQuiz();
</script></body></html>
