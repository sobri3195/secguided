const state = { quiz: [], current: 0, answers: [], started: false, instant: true, revealed: false };
const el = {
  mode: document.getElementById('mode'), instant: document.getElementById('instantToggle'), start: document.getElementById('startBtn'),
  reset: document.getElementById('resetBtn'), questionBox: document.getElementById('questionBox'), actions: document.getElementById('actions'),
  status: document.getElementById('status'), best: document.getElementById('bestScore'), history: document.getElementById('history')
};
const storageKey = 'offlineQuizCyber_v1';
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function buildQuiz(count){ return shuffle(QUESTION_BANK).slice(0,count).map(q=>{ const indexed=q.options.map((text,idx)=>({text,originalIndex:idx})); const so=shuffle(indexed); const correctAnswerIndex=so.findIndex(o=>o.originalIndex===q.correctAnswerIndex); return {...q, options: so.map(o=>o.text), correctAnswerIndex}; }); }
function readStore(){ const fallback={best:0,attempts:[]}; try{return JSON.parse(localStorage.getItem(storageKey))||fallback;}catch{return fallback;} }
function writeStore(data){ localStorage.setItem(storageKey, JSON.stringify(data)); }
function renderMeta(){ const store=readStore(); el.best.textContent=`${store.best}%`; if(!store.attempts.length){ el.history.innerHTML='<em>No attempts yet.</em>'; return;} el.history.innerHTML='<ul>'+store.attempts.slice().reverse().map(a=>`<li>${a.date} • ${a.mode}Q • Score: <strong>${a.score}/${a.total}</strong> (${a.percent}%)</li>`).join('')+'</ul>'; }
function startQuiz(){ state.instant=el.instant.checked; const count=Number(el.mode.value); state.quiz=buildQuiz(count); state.current=0; state.answers=Array(count).fill(null); state.started=true; state.revealed=false; render(); }
function answerCurrent(idx){ state.answers[state.current]=idx; if(state.instant) state.revealed=true; render(); }
function nextQuestion(){ state.revealed=false; if(state.current<state.quiz.length-1){ state.current+=1; render(); } else submitQuiz(); }
function submitQuiz(){ const total=state.quiz.length; let score=0; state.quiz.forEach((q,i)=>{ if(state.answers[i]===q.correctAnswerIndex) score++; }); const percent=Math.round((score/total)*100); const store=readStore(); const best=Math.max(store.best,percent); const attempts=[...store.attempts,{date:new Date().toLocaleString(),mode:total,score,total,percent}].slice(-30); writeStore({best,attempts}); el.status.innerHTML=`<span class="pill">Final Score: ${score}/${total} (${percent}%)</span>`; el.questionBox.innerHTML=state.quiz.map((q,i)=>{ const user=state.answers[i]; const correct=q.correctAnswerIndex; const ok=user===correct; return `<div class="feedback ${ok?'good':'bad'}"><strong>Q${i+1}.</strong> ${q.question}<br><span class="muted">Your answer: ${user===null?'Not answered':q.options[user]}</span><br><span>Correct answer: <strong>${q.options[correct]}</strong></span><br><span class="muted">Explanation: ${q.explanation}</span></div>`; }).join(''); el.actions.innerHTML='<button class="primary" onclick="startQuiz()">Try Again</button>'; state.started=false; renderMeta(); }
function render(){ renderMeta(); if(!state.started){ el.status.innerHTML=`<span class="pill">Ready • ${QUESTION_BANK.length} total questions loaded</span>`; el.questionBox.innerHTML='<p class="muted">Choose mode and press <strong>Start / Restart</strong>.</p>'; el.actions.innerHTML=''; return; } const q=state.quiz[state.current]; const picked=state.answers[state.current]; const answered=picked!==null; el.status.innerHTML=`<span class="pill">Question ${state.current+1} / ${state.quiz.length}</span><span class="pill">Difficulty: ${q.difficulty}</span><span class="pill">Tags: ${q.tags.join(', ')}</span>`; const optionsHtml=q.options.map((opt,idx)=>{ let cls='opt'; if(state.revealed){ if(idx===q.correctAnswerIndex) cls+=' correct'; else if(idx===picked) cls+=' wrong'; } return `<label class="${cls}"><input type="radio" name="answer" ${picked===idx?'checked':''} onchange="answerCurrent(${idx})" /><span>${opt}</span></label>`; }).join(''); let feedback=''; if(state.revealed&&answered){ const ok=picked===q.correctAnswerIndex; feedback=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'Correct':'Not quite'}</strong><br>Correct answer: <strong>${q.options[q.correctAnswerIndex]}</strong><br><span class="muted">${q.explanation}</span></div>`; } el.questionBox.innerHTML=`<div class="q">${q.question}</div><div class="opts">${optionsHtml}</div>${feedback}`; const btnText=state.current===state.quiz.length-1?(state.instant?'Finish':'Submit Quiz'):'Next'; const reviewBtn=(!state.instant&&answered&&!state.revealed)?'<button onclick="state.revealed=true;render()">Reveal Explanation</button>':''; el.actions.innerHTML=`${reviewBtn}<button class="primary" onclick="${state.current===state.quiz.length-1?'submitQuiz()':'nextQuestion()'}" ${!answered?'disabled':''}>${btnText}</button>`; }
el.start.addEventListener('click', startQuiz);
el.reset.addEventListener('click', ()=>{ localStorage.removeItem(storageKey); state.started=false; render(); });
render();
